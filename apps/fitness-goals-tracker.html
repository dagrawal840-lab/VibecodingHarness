<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Goals Tracker</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #f2f4f7;
    --text-dim: #9aa2b1;
    --text-faint: #626a79;
    --green: #34d399;
    --green-dim: #14532d;
    --orange: #fb923c;
    --blue: #60a5fa;
    --purple: #c084fc;
    --red: #f87171;
    --radius: 14px;
    --radius-sm: 9px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 920px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  header.top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
  }

  header.top h1 {
    font-size: 24px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  header.top p {
    margin: 0;
    color: var(--text-dim);
    font-size: 14px;
  }

  .btn {
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    font-size: 14px;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: var(--green);
    color: #06231a;
  }
  .btn-primary:hover { opacity: 0.9; }

  .btn-ghost {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--text-faint); }

  .btn-sm { padding: 6px 12px; font-size: 13px; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }

  .stat-card .value {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.1;
  }

  .stat-card .label {
    color: var(--text-dim);
    font-size: 12.5px;
    margin-top: 4px;
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }

  .tab {
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 4px;
    margin-right: 18px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab.active {
    color: var(--text);
    border-bottom-color: var(--green);
  }

  .goals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  .goal-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .goal-card.complete {
    border-color: rgba(52, 211, 153, 0.4);
    background: linear-gradient(180deg, rgba(52,211,153,0.06), var(--panel) 40%);
  }

  .goal-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .goal-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .goal-icon svg { width: 19px; height: 19px; }

  .goal-name {
    font-size: 15.5px;
    font-weight: 650;
    margin: 0 0 2px;
  }

  .goal-category {
    font-size: 12px;
    color: var(--text-dim);
  }

  .goal-delete {
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    padding: 4px;
    line-height: 0;
  }
  .goal-delete:hover { color: var(--red); }

  .progress-track {
    height: 8px;
    background: var(--panel-2);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.3s ease;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .progress-meta strong { color: var(--text); font-weight: 650; }

  .goal-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 2px;
  }

  .deadline {
    font-size: 12px;
    color: var(--text-faint);
  }
  .deadline.urgent { color: var(--orange); }

  .recent-logs {
    font-size: 12px;
    color: var(--text-faint);
    border-top: 1px dashed var(--border);
    padding-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .recent-logs .log-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .recent-logs .log-note {
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty-state .btn { margin-top: 14px; }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 8, 12, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .overlay.hidden { display: none; }

  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    width: 100%;
    max-width: 380px;
  }
  .modal h2 {
    margin: 0 0 16px;
    font-size: 17px;
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    padding: 9px 11px;
    font-size: 14px;
    font-family: inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: var(--green);
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }

  .log-goal-title {
    font-size: 13px;
    color: var(--text-dim);
    margin: -10px 0 16px;
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <h1>Fitness Goals</h1>
      <p id="monthLabel">August 2026</p>
    </div>
    <button class="btn btn-primary" id="openNewGoal">+ New Goal</button>
  </header>

  <div class="stats-row">
    <div class="stat-card">
      <div class="value" id="statActive">0</div>
      <div class="label">Active goals</div>
    </div>
    <div class="stat-card">
      <div class="value" id="statCompleted">0</div>
      <div class="label">Completed</div>
    </div>
    <div class="stat-card">
      <div class="value" id="statStreak">0</div>
      <div class="label">Day logging streak</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-filter="active">Active</button>
    <button class="tab" data-filter="completed">Completed</button>
    <button class="tab" data-filter="all">All</button>
  </div>

  <div class="goals-grid" id="goalsGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <p>No goals here yet.</p>
    <button class="btn btn-primary" id="emptyNewGoal">+ New Goal</button>
  </div>
</div>

<!-- New Goal Modal -->
<div class="overlay hidden" id="newGoalOverlay">
  <div class="modal">
    <h2>New goal</h2>
    <div class="field">
      <label for="ngName">Goal name</label>
      <input id="ngName" type="text" placeholder="e.g. Run 50 miles this month" maxlength="60">
    </div>
    <div class="field">
      <label for="ngCategory">Category</label>
      <select id="ngCategory">
        <option value="cardio">Cardio</option>
        <option value="strength">Strength</option>
        <option value="wellness">Wellness</option>
        <option value="weight">Weight</option>
      </select>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="ngTarget">Target</label>
        <input id="ngTarget" type="number" min="0.1" step="0.1" placeholder="50">
      </div>
      <div class="field">
        <label for="ngUnit">Unit</label>
        <input id="ngUnit" type="text" placeholder="mi, lbs, sessions..." maxlength="14">
      </div>
    </div>
    <div class="field">
      <label for="ngDeadline">Deadline</label>
      <input id="ngDeadline" type="date">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="ngCancel">Cancel</button>
      <button class="btn btn-primary" id="ngSave">Create goal</button>
    </div>
  </div>
</div>

<!-- Log Progress Modal -->
<div class="overlay hidden" id="logOverlay">
  <div class="modal">
    <h2>Log progress</h2>
    <p class="log-goal-title" id="logGoalTitle"></p>
    <div class="field">
      <label for="lgAmount">Amount</label>
      <input id="lgAmount" type="number" min="0.1" step="0.1" placeholder="3.2">
    </div>
    <div class="field">
      <label for="lgNote">Note (optional)</label>
      <input id="lgNote" type="text" placeholder="e.g. Tempo run, felt strong" maxlength="80">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="lgCancel">Cancel</button>
      <button class="btn btn-primary" id="lgSave">Add entry</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "fitnessGoalsTracker.v1";
  var TODAY = new Date("2026-08-02");

  var CATEGORY_META = {
    cardio:   { label: "Cardio",   color: "#34d399", bg: "rgba(52,211,153,0.14)", icon: iconRun() },
    strength: { label: "Strength", color: "#fb923c", bg: "rgba(251,146,60,0.14)", icon: iconDumbbell() },
    wellness: { label: "Wellness", color: "#60a5fa", bg: "rgba(96,165,250,0.14)", icon: iconDrop() },
    weight:   { label: "Weight",   color: "#c084fc", bg: "rgba(192,132,252,0.14)", icon: iconScale() }
  };

  function iconRun() {
    return '<path d="M13.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM6 21l2.3-5.2-1.7-1.6L4 17l-1.5-1 3.6-4.9 3.1 1 2-3.6 3 1.4-1.6 3.6L16 15v6h-2v-4.8l-2.7-2.5-1.9 4.3L11 21H6z" fill="currentColor"/>';
  }
  function iconDumbbell() {
    return '<path d="M2 10h2v4H2v-4zm3-2h2v8H5V8zm3 3h4v2H8v-2zm5-3h2v8h-2V8zm3 2h2v4h-2v-4z" fill="currentColor"/>';
  }
  function iconDrop() {
    return '<path d="M12 2s6 6.8 6 11.2A6 6 0 0 1 6 13.2C6 8.8 12 2 12 2z" fill="currentColor"/>';
  }
  function iconScale() {
    return '<path d="M4 20h16v2H4v-2zm7-16h2v3.1a5 5 0 0 1 1.9.8l1.4-1.4 1.4 1.4-1.4 1.4c.5.7.8 1.5.9 2.4H19v2h-1.8a5 5 0 0 1-1 2.4l1.4 1.4-1.4 1.4-1.4-1.4a5 5 0 0 1-1.8.8V19h-2v-3.1a5 5 0 0 1-1.8-.8l-1.4 1.4-1.4-1.4 1.4-1.4a5 5 0 0 1-1-2.4H5v-2h1.8c.1-.9.4-1.7.9-2.4L6.3 5.5l1.4-1.4 1.4 1.4a5 5 0 0 1 1.9-.8V4zm1 5a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" fill="currentColor"/>';
  }

  function seedGoals() {
    return [
      {
        id: "g1", name: "Run 50 miles this month", category: "cardio",
        unit: "mi", target: 50, deadline: "2026-08-31", createdAt: "2026-08-01",
        logs: [
          { date: "2026-07-05", amount: 4.2, note: "Easy loop around the park" },
          { date: "2026-07-09", amount: 6, note: "Tempo run, felt strong" },
          { date: "2026-07-14", amount: 3.1, note: "Recovery jog" },
          { date: "2026-07-19", amount: 8, note: "Long run, humid" },
          { date: "2026-07-24", amount: 5.5, note: "Hill repeats" },
          { date: "2026-07-29", amount: 5.2, note: "Evening run with Sam" }
        ]
      },
      {
        id: "g2", name: "Strength train 12 sessions", category: "strength",
        unit: "sessions", target: 12, deadline: "2026-08-31", createdAt: "2026-08-01",
        logs: [
          { date: "2026-07-02", amount: 1, note: "Push day - bench 165x5" },
          { date: "2026-07-06", amount: 1, note: "Pull day - deadlift 225x3" },
          { date: "2026-07-10", amount: 1, note: "Legs - squat 185x5" },
          { date: "2026-07-15", amount: 1, note: "Push day" },
          { date: "2026-07-20", amount: 1, note: "Pull day" },
          { date: "2026-07-27", amount: 1, note: "Legs day" },
          { date: "2026-07-31", amount: 1, note: "Full body, short on time" }
        ]
      },
      {
        id: "g3", name: "30-day water intake streak", category: "wellness",
        unit: "days", target: 30, deadline: "2026-08-30", createdAt: "2026-08-01",
        logs: Array.from({ length: 18 }, function (_, i) {
          var d = new Date("2026-07-14");
          d.setDate(d.getDate() + i);
          return { date: d.toISOString().slice(0, 10), amount: 1, note: "64oz+ logged" };
        })
      },
      {
        id: "g4", name: "Lose 8 lbs", category: "weight",
        unit: "lbs", target: 8, deadline: "2026-09-15", createdAt: "2026-07-10",
        logs: [
          { date: "2026-07-12", amount: 1.5, note: "Week 1 weigh-in" },
          { date: "2026-07-19", amount: 1, note: "Week 2 weigh-in" },
          { date: "2026-07-26", amount: 1, note: "Plateau week" }
        ]
      },
      {
        id: "g5", name: "Finish Couch to 5K program", category: "cardio",
        unit: "weeks", target: 8, deadline: "2026-07-20", createdAt: "2026-05-25",
        logs: [
          { date: "2026-07-18", amount: 8, note: "Completed week 8 - ran 5K without stopping" }
        ]
      }
    ];
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    var seed = seedGoals();
    save(seed);
    return seed;
  }

  function save(goals) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(goals));
  }

  var goals = load();
  var currentFilter = "active";
  var pendingLogGoalId = null;

  function currentAmount(goal) {
    return goal.logs.reduce(function (sum, l) { return sum + l.amount; }, 0);
  }

  function isComplete(goal) {
    return currentAmount(goal) >= goal.target;
  }

  function daysUntil(dateStr) {
    var d = new Date(dateStr);
    var diff = Math.ceil((d - TODAY) / (1000 * 60 * 60 * 24));
    return diff;
  }

  function fmtDeadline(dateStr) {
    var days = daysUntil(dateStr);
    if (days < 0) return "Past deadline";
    if (days === 0) return "Due today";
    if (days === 1) return "1 day left";
    return days + " days left";
  }

  function computeStreak() {
    var daysWithLog = {};
    goals.forEach(function (g) {
      g.logs.forEach(function (l) { daysWithLog[l.date] = true; });
    });
    var streak = 0;
    var cursor = new Date(TODAY);
    while (true) {
      var key = cursor.toISOString().slice(0, 10);
      if (daysWithLog[key]) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  function render() {
    var active = goals.filter(function (g) { return !isComplete(g); });
    var completed = goals.filter(isComplete);

    document.getElementById("statActive").textContent = active.length;
    document.getElementById("statCompleted").textContent = completed.length;
    document.getElementById("statStreak").textContent = computeStreak();

    var list = currentFilter === "active" ? active
      : currentFilter === "completed" ? completed
      : goals.slice().sort(function (a, b) { return isComplete(a) - isComplete(b); });

    var grid = document.getElementById("goalsGrid");
    var empty = document.getElementById("emptyState");
    grid.innerHTML = "";

    if (list.length === 0) {
      grid.style.display = "none";
      empty.style.display = "block";
      return;
    }
    grid.style.display = "grid";
    empty.style.display = "none";

    list.forEach(function (goal) {
      grid.appendChild(renderCard(goal));
    });
  }

  function renderCard(goal) {
    var meta = CATEGORY_META[goal.category];
    var amount = currentAmount(goal);
    var pct = Math.min(100, Math.round((amount / goal.target) * 100));
    var complete = isComplete(goal);

    var card = document.createElement("div");
    card.className = "goal-card" + (complete ? " complete" : "");

    var recentLogs = goal.logs.slice().sort(function (a, b) {
      return b.date.localeCompare(a.date);
    }).slice(0, 2);

    var deadlineDays = daysUntil(goal.deadline);
    var urgentClass = (!complete && deadlineDays <= 5 && deadlineDays >= 0) ? " urgent" : "";

    card.innerHTML =
      '<div class="goal-head">' +
        '<div style="display:flex; gap:12px; align-items:flex-start;">' +
          '<div class="goal-icon" style="background:' + meta.bg + '; color:' + meta.color + '"><svg viewBox="0 0 24 24">' + meta.icon + '</svg></div>' +
          '<div>' +
            '<p class="goal-name">' + escapeHtml(goal.name) + (complete ? " ✓" : "") + '</p>' +
            '<p class="goal-category">' + meta.label + '</p>' +
          '</div>' +
        '</div>' +
        '<button class="goal-delete" data-delete="' + goal.id + '" title="Delete goal">✕</button>' +
      '</div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%; background:' + meta.color + '"></div></div>' +
      '<div class="progress-meta"><span><strong>' + fmtNum(amount) + '</strong> / ' + fmtNum(goal.target) + ' ' + escapeHtml(goal.unit) + '</span><span>' + pct + '%</span></div>' +
      '<div class="goal-footer">' +
        '<span class="deadline' + urgentClass + '">' + (complete ? "Completed" : fmtDeadline(goal.deadline)) + '</span>' +
        (complete ? '' : '<button class="btn btn-primary btn-sm" data-log="' + goal.id + '">Log progress</button>') +
      '</div>' +
      (recentLogs.length ? '<div class="recent-logs">' + recentLogs.map(function (l) {
        return '<div class="log-row"><span>' + fmtShortDate(l.date) + ' · +' + fmtNum(l.amount) + ' ' + escapeHtml(goal.unit) + '</span><span class="log-note">' + escapeHtml(l.note || "") + '</span></div>';
      }).join("") + '</div>' : '');

    return card;
  }

  function fmtNum(n) {
    return (Math.round(n * 10) / 10).toString();
  }

  function fmtShortDate(dateStr) {
    var d = new Date(dateStr);
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str == null ? "" : str;
    return div.innerHTML;
  }

  // Tabs
  document.querySelectorAll(".tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      document.querySelectorAll(".tab").forEach(function (t) { t.classList.remove("active"); });
      tab.classList.add("active");
      currentFilter = tab.getAttribute("data-filter");
      render();
    });
  });

  // Card click delegation
  document.getElementById("goalsGrid").addEventListener("click", function (e) {
    var logBtn = e.target.closest("[data-log]");
    var delBtn = e.target.closest("[data-delete]");
    if (logBtn) openLogModal(logBtn.getAttribute("data-log"));
    if (delBtn) {
      var id = delBtn.getAttribute("data-delete");
      var goal = goals.find(function (g) { return g.id === id; });
      if (goal && confirm('Delete "' + goal.name + '"?')) {
        goals = goals.filter(function (g) { return g.id !== id; });
        save(goals);
        render();
      }
    }
  });

  // New Goal modal
  var newGoalOverlay = document.getElementById("newGoalOverlay");
  function openNewGoalModal() {
    document.getElementById("ngName").value = "";
    document.getElementById("ngCategory").value = "cardio";
    document.getElementById("ngTarget").value = "";
    document.getElementById("ngUnit").value = "";
    document.getElementById("ngDeadline").value = "";
    newGoalOverlay.classList.remove("hidden");
    document.getElementById("ngName").focus();
  }
  document.getElementById("openNewGoal").addEventListener("click", openNewGoalModal);
  document.getElementById("emptyNewGoal").addEventListener("click", openNewGoalModal);
  document.getElementById("ngCancel").addEventListener("click", function () {
    newGoalOverlay.classList.add("hidden");
  });
  document.getElementById("ngSave").addEventListener("click", function () {
    var name = document.getElementById("ngName").value.trim();
    var category = document.getElementById("ngCategory").value;
    var target = parseFloat(document.getElementById("ngTarget").value);
    var unit = document.getElementById("ngUnit").value.trim() || "units";
    var deadline = document.getElementById("ngDeadline").value;

    if (!name || !target || target <= 0 || !deadline) {
      alert("Please fill in a name, a target greater than 0, and a deadline.");
      return;
    }

    goals.push({
      id: "g" + Date.now(),
      name: name, category: category, unit: unit, target: target,
      deadline: deadline, createdAt: TODAY.toISOString().slice(0, 10), logs: []
    });
    save(goals);
    newGoalOverlay.classList.add("hidden");
    render();
  });

  // Log Progress modal
  var logOverlay = document.getElementById("logOverlay");
  function openLogModal(goalId) {
    var goal = goals.find(function (g) { return g.id === goalId; });
    if (!goal) return;
    pendingLogGoalId = goalId;
    document.getElementById("logGoalTitle").textContent = goal.name + " · " + goal.unit;
    document.getElementById("lgAmount").value = "";
    document.getElementById("lgNote").value = "";
    logOverlay.classList.remove("hidden");
    document.getElementById("lgAmount").focus();
  }
  document.getElementById("lgCancel").addEventListener("click", function () {
    logOverlay.classList.add("hidden");
  });
  document.getElementById("lgSave").addEventListener("click", function () {
    var amount = parseFloat(document.getElementById("lgAmount").value);
    var note = document.getElementById("lgNote").value.trim();
    if (!amount || amount <= 0) {
      alert("Enter an amount greater than 0.");
      return;
    }
    var goal = goals.find(function (g) { return g.id === pendingLogGoalId; });
    goal.logs.push({ date: TODAY.toISOString().slice(0, 10), amount: amount, note: note });
    save(goals);
    logOverlay.classList.add("hidden");
    render();
  });

  [newGoalOverlay, logOverlay].forEach(function (overlay) {
    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) overlay.classList.add("hidden");
    });
  });

  render();
})();
</script>

</body>
</html>
